name: Build mod

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build
        run: bash ./gradlew build --no-daemon --console=plain
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: cxvisuals-minecraft-26.3
          path: build/libs/*.jar
          if-no-files-found: error
